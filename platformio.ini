; PlatformIO Project Configuration File
; Goalkeeper robot — Arduino Uno target
;
; To switch back to a Mega, change [env:uno] to [env:megaatmega2560]
; and set board = megaatmega2560.

[env:uno]
platform = atmelavr
board    = uno
framework = arduino

monitor_speed = 115200
upload_speed  = 115200

lib_deps =
  adafruit/Adafruit Unified Sensor
  adafruit/Adafruit BusIO
  pololu/VL53L1X
  pololu/VL53L0X
  br3ttb/PID@^1.2.1
  waspinator/AccelStepper@^1.64.0

lib_extra_dirs = lib/Sensors
lib_ldf_mode   = chain+

build_flags =
  -I include
  -I lib/Sensors/qtr
  -I lib/Sensors/mux
  -I lib/Sensors/IR_mux